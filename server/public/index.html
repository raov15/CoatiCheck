<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COATI Check</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f0f4f8; color: #1b2a4a; }
    main { width: min(420px, calc(100% - 32px)); padding: 32px; background: white; border-radius: 18px; box-shadow: 0 12px 40px #1b2a4a22; }
    h1 { margin: 0 0 8px; } p { color: #52627a; }
    label { display: block; margin-top: 16px; font-weight: 700; }
    input { box-sizing: border-box; width: 100%; margin-top: 8px; padding: 12px; border: 1px solid #c7d2df; border-radius: 8px; font-size: 16px; }
    button { width: 100%; margin-top: 24px; padding: 13px; border: 0; border-radius: 8px; background: #1b2a4a; color: white; font-size: 16px; font-weight: 700; cursor: pointer; }
    #message { min-height: 24px; margin-top: 16px; color: #b3261e; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>COATI Check</h1>
    <p>Portal administrativo de asistencia</p>
    <form id="login">
      <label for="username">Usuario</label>
      <input id="username" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Iniciar sesión</button>
      <div id="message" role="alert"></div>
    </form>
    <section id="welcome" class="hidden">
      <h2>Sesión iniciada</h2>
      <p id="status"></p>
      <form id="change-password">
        <h3>Cambiar contraseña</h3>
        <label for="current-password">Contraseña actual</label>
        <input id="current-password" type="password" autocomplete="current-password" required>
        <label for="new-password">Nueva contraseña</label>
        <input id="new-password" type="password" minlength="8" autocomplete="new-password" required>
        <button type="submit">Actualizar contraseña</button>
      </form>
      <section id="companies-section">
        <h3>Empresas registradas</h3>
        <form id="company-form" enctype="multipart/form-data">
          <label for="company-name">Nombre de la empresa</label>
          <input id="company-name" required>
          <label for="company-slug">Identificador</label>
          <input id="company-slug" pattern="[a-z0-9-]+" required>
          <label for="company-logo">Logo PNG/JPG</label>
          <input id="company-logo" type="file" accept="image/png,image/jpeg">
          <button type="submit">Crear empresa</button>
        </form>
        <button id="load-companies" type="button">Cargar empresas</button>
        <ul id="companies"></ul>
        <section id="sites-section">
          <h3>Sitios o sucursales</h3>
          <label for="sites-company">ID de empresa</label>
          <input id="sites-company">
          <label for="site-name">Nombre del sitio</label>
          <input id="site-name">
          <button id="create-site" type="button">Crear sitio</button>
          <button id="load-sites" type="button">Cargar sitios</button>
          <ul id="sites"></ul>
        </section>
        <section id="devices-section">
          <h3>Celulares asociados</h3>
          <label for="devices-company">ID de empresa</label>
          <input id="devices-company">
          <button id="load-devices" type="button">Cargar celulares</button>
          <ul id="devices"></ul>
        </section>
        <form id="user-form">
          <h3>Agregar usuario de empresa</h3>
          <label for="user-company">ID de empresa</label>
          <input id="user-company" required>
          <label for="user-username">Usuario</label>
          <input id="user-username" autocomplete="username" required>
          <label for="user-password">Contraseña temporal</label>
          <input id="user-password" type="password" minlength="8" required>
          <label for="user-name">Nombre completo</label>
          <input id="user-name" required>
          <label for="user-role">Rol</label>
          <select id="user-role">
            <option value="operator">Operador</option>
            <option value="administrator">Administrador de empresa</option>
          </select>
          <label for="user-code">Código de empleado</label>
          <input id="user-code">
          <button type="submit">Crear usuario</button>
        </form>
        <section id="report-section">
          <h3>Asistencias de una empresa</h3>
          <label for="report-company">ID de empresa</label>
          <input id="report-company">
          <button id="load-report" type="button">Cargar asistencias</button>
          <ul id="attendance"></ul>
        </section>
      </section>
      <button id="logout" type="button">Cerrar sesión</button>
    </section>
  </main>
  <script>
    const form = document.querySelector("#login");
    const welcome = document.querySelector("#welcome");
    const message = document.querySelector("#message");
    const status = document.querySelector("#status");
    const changePassword = document.querySelector("#change-password");
    const companies = document.querySelector("#companies");
    const companyForm = document.querySelector("#company-form");
    const userForm = document.querySelector("#user-form");
    const attendance = document.querySelector("#attendance");
    const devices = document.querySelector("#devices");
    const sites = document.querySelector("#sites");
    const tokenKey = "coati_admin_token";

    async function authorizedFetch(url, options = {}) {
      const headers = { ...(options.headers || {}), Authorization: `Bearer ${sessionStorage.getItem(tokenKey)}` };
      return fetch(url, { ...options, headers });
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";
      const response = await fetch("/api/admin/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.querySelector("#username").value,
          password: document.querySelector("#password").value
        })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        message.textContent = data.error || "No se pudo iniciar sesión";
        return;
      }
      sessionStorage.setItem(tokenKey, data.token);
      form.classList.add("hidden");
      welcome.classList.remove("hidden");
      status.textContent = data.must_change_password
        ? "Debe cambiar la contraseña antes de administrar el portal."
        : "Sesión administrativa activa.";
      loadCompanies();
    });

    changePassword.addEventListener("submit", async (event) => {
      event.preventDefault();
      const response = await authorizedFetch("/api/admin/change-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          current_password: document.querySelector("#current-password").value,
          password: document.querySelector("#new-password").value
        })
      });
      const data = await response.json().catch(() => ({}));
      status.textContent = response.ok ? "Contraseña actualizada correctamente." : (data.error || "No se pudo cambiar la contraseña");
      if (response.ok) changePassword.reset();
    });

    companyForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const body = new FormData();
      body.append("name", document.querySelector("#company-name").value);
      body.append("slug", document.querySelector("#company-slug").value);
      const logo = document.querySelector("#company-logo").files[0];
      if (logo) body.append("logo", logo);
      const response = await authorizedFetch("/api/admin/companies", { method: "POST", body });
      const data = await response.json().catch(() => ({}));
      status.textContent = response.ok
        ? `Empresa creada: ${data.name}`
        : (data.error || "No se pudo crear la empresa");
      if (response.ok) {
        companyForm.reset();
        loadCompanies();
      }
    });

    async function loadCompanies() {
      const response = await authorizedFetch("/api/admin/companies");
      const data = await response.json().catch(() => []);
      companies.replaceChildren();
      if (!response.ok) {
        companies.textContent = data.error || "No se pudieron cargar las empresas";
        return;
      }
      data.forEach((company) => {
        const item = document.createElement("li");
        item.textContent = `${company.name} (${company.slug})`;
        if (company.logo_path) {
          const logo = document.createElement("img");
          logo.src = company.logo_path;
          logo.alt = `Logo de ${company.name}`;
          logo.style.cssText = "width:32px;height:32px;object-fit:contain;vertical-align:middle;margin-left:8px";
          item.appendChild(logo);
        }
        const codeButton = document.createElement("button");
        codeButton.type = "button";
        codeButton.textContent = "Generar código de celular";
        codeButton.style.width = "auto";
        codeButton.style.margin = "8px";
        codeButton.addEventListener("click", () => createEnrollmentCode(company.id));
        item.appendChild(codeButton);
        companies.appendChild(item);
      });
    }

    async function createEnrollmentCode(companyId) {
      const response = await authorizedFetch(`/api/admin/companies/${companyId}/enrollment-codes`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ expires_in_minutes: 30 })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        status.textContent = data.error || "No se pudo generar el código";
        return;
      }
      status.textContent = `Código de enrolamiento: ${data.enrollment_code}. Expira: ${data.expires_at}`;
    }

    userForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const response = await authorizedFetch("/api/admin/users", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          company_id: document.querySelector("#user-company").value,
          username: document.querySelector("#user-username").value,
          password: document.querySelector("#user-password").value,
          full_name: document.querySelector("#user-name").value,
          role: document.querySelector("#user-role").value,
          employee_code: document.querySelector("#user-code").value || null
        })
      });
      const data = await response.json().catch(() => ({}));
      status.textContent = response.ok
        ? `Usuario creado: ${data.username}. Debe cambiar su contraseña al iniciar sesión.`
        : (data.error || "No se pudo crear el usuario");
      if (response.ok) userForm.reset();
    });

    document.querySelector("#load-report").addEventListener("click", async () => {
      const companyId = document.querySelector("#report-company").value.trim();
      if (!companyId) {
        status.textContent = "Introduce el ID de la empresa";
        return;
      }
      const response = await authorizedFetch(`/api/admin/companies/${companyId}/attendance`);
      const data = await response.json().catch(() => ({}));
      attendance.replaceChildren();
      if (!response.ok) {
        status.textContent = data.error || "No se pudieron cargar las asistencias";
        return;
      }
      data.records.forEach((record) => {
        const item = document.createElement("li");
        item.textContent = `${record.employee_id} · ${record.event_type} · ${new Date(Number(record.occurred_at)).toLocaleString()}`;
        attendance.appendChild(item);
      });
      status.textContent = `${data.records.length} registros cargados`;
    });

    document.querySelector("#load-devices").addEventListener("click", async () => {
      const companyId = document.querySelector("#devices-company").value.trim();
      if (!companyId) {
        status.textContent = "Introduce el ID de la empresa";
        return;
      }
      const response = await authorizedFetch(`/api/admin/companies/${companyId}/devices`);
      const data = await response.json().catch(() => ({}));
      devices.replaceChildren();
      if (!response.ok) {
        status.textContent = data.error || "No se pudieron cargar los celulares";
        return;
      }
      data.forEach((device) => {
        const item = document.createElement("li");
        item.textContent = `${device.device_name} · ${device.id_local} · ${device.created_at}`;
        devices.appendChild(item);
      });
      status.textContent = `${data.length} celulares cargados`;
    });

    document.querySelector("#create-site").addEventListener("click", async () => {
      const companyId = document.querySelector("#sites-company").value.trim();
      const name = document.querySelector("#site-name").value.trim();
      const response = await authorizedFetch(`/api/admin/companies/${companyId}/sites`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name })
      });
      const data = await response.json().catch(() => ({}));
      status.textContent = response.ok ? `Sitio creado: ${data.name}` : (data.error || "No se pudo crear el sitio");
      if (response.ok) {
        document.querySelector("#site-name").value = "";
        loadSites();
      }
    });

    document.querySelector("#load-sites").addEventListener("click", loadSites);

    async function loadSites() {
      const companyId = document.querySelector("#sites-company").value.trim();
      if (!companyId) {
        status.textContent = "Introduce el ID de la empresa";
        return;
      }
      const response = await authorizedFetch(`/api/admin/companies/${companyId}/sites`);
      const data = await response.json().catch(() => []);
      sites.replaceChildren();
      if (!response.ok) {
        status.textContent = data.error || "No se pudieron cargar los sitios";
        return;
      }
      data.forEach((site) => {
        const item = document.createElement("li");
        item.textContent = `${site.name} · ${site.id}`;
        sites.appendChild(item);
      });
      status.textContent = `${data.length} sitios cargados`;
    }

    document.querySelector("#load-companies").addEventListener("click", loadCompanies);

    document.querySelector("#logout").addEventListener("click", () => {
      sessionStorage.removeItem(tokenKey);
      welcome.classList.add("hidden");
      form.classList.remove("hidden");
      form.reset();
    });
  </script>
</body>
</html>
