services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coati-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://coati:coati_password@db:5432/coaticheck
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET debe estar definido}
      - ADMIN_BOOTSTRAP_USERNAME=${ADMIN_BOOTSTRAP_USERNAME:-admin}
      - ADMIN_BOOTSTRAP_PASSWORD=${ADMIN_BOOTSTRAP_PASSWORD:?ADMIN_BOOTSTRAP_PASSWORD debe estar definido}
      - UPLOAD_DIR=/app/uploads/logos
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - internal
      - nginx-proxy

  db:
    image: postgres:16-alpine
    container_name: coati-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=coati
      - POSTGRES_PASSWORD=coati_password
      - POSTGRES_DB=coaticheck
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coati -d coaticheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

volumes:
  db_data:
  uploads_data:

networks:
  internal:
    driver: bridge
  nginx-proxy:
    external: true
